name: Selecionar notícias do dia com IA

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  gerar-noticias:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Gerar seleção de notícias com IA
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/gerar-noticias.mjs

      - name: Commitar e enviar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/noticiasDestaque.json
          git diff --staged --quiet || git commit -m "Atualiza destaques do dia (IA)"
          git push
